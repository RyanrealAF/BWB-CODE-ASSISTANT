<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BWB Urban Myth Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>BWB Urban Myth Engine</h1>
    <div class="form-group">
      <label for="seed">Enter a seed for your myth:</label>
      <input type="text" id="seed" placeholder="e.g., a forgotten song">
    </div>
    <button id="generate">Generate Myth</button>
    <div class="myth-container">
      <h2>Your Myth:</h2>
      <p id="myth"></p>
    </div>
    <div class="archetypes-container">
      <h2>Archetypes</h2>
      <ul id="archetypes"></ul>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
